<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Paprika canvas renderer bench</title>
    <style>
      body { margin: 0; font: 13px system-ui, sans-serif; background: #1b1b1f; color: #eee; }
      #bar { padding: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      #stage { position: relative; width: 1280px; height: 800px; overflow: hidden; background: #ededf0; }
      #stage > * { position: absolute; inset: 0; }
      pre { padding: 8px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="bar">
      <select id="doc" aria-label="documento"><option>demo</option><option>bezier</option><option>1000</option><option selected>10000</option><option>50000</option></select>
      <select id="mode" aria-label="modo de render"><option>auto</option><option>webgpu</option><option>cpu</option><option>canvas2d</option><option>dom</option></select>
      <button id="run">run</button>
      <span id="status"></span>
    </div>
    <div id="stage"></div>
    <pre id="out"></pre>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
