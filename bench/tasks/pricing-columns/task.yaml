id: pricing-columns
name: Three pricing columns with auto-layout
description: >-
  Measures whether the agent reaches for Paprika's frame layout (row/column, gap, padding) instead
  of placing every box by hand, and whether it keeps a color system intact.
category: feature
difficulty: hard
timeout: 20m

fixture: pricing-columns

prompt: |
  Work in the current directory. `document.paprika.json` starts with no nodes and with the tokens
  `paper`, `panel`, `ink`, `muted` and `brand`.

  Drive Paprika through its MCP server (stdio):

    P="$PAPRIKA_BENCH/server-go/bin/paprika"
    "$P" import "$PWD/document.paprika.json" --db "$PWD/paprika.db" --replace
    "$P" mcp --db "$PWD/paprika.db" --no-ui

  If `$PAPRIKA_BENCH/server-go/bin/paprika` is missing, build it first with `pnpm go:build` inside
  `$PAPRIKA_BENCH`. Do not edit the JSON by hand; the server saves every tool call to the
  database.
  When you are done, close the server and write the result back to the file the score reads:
  `"$P" export --db "$PWD/paprika.db" -o "$PWD/document.paprika.json"`.

  Build a pricing section with three plans. The score checks exactly these rules:

  1. exactly one root frame, at least 900 wide, whose layout is `mode: row` with `gap` >= 16 and
     `padding` >= 16 on every side;
  2. the frame has exactly three child frames, the columns;
  3. every column uses `mode: column` with a gap and padding >= 12 on every side, and all three
     columns have the same width (a number or `fill`);
  4. every column contains at least 5 texts (plan name, price, and three features at minimum);
  5. every column has one price text of at least 28px that contains a number;
  6. exactly one column is highlighted: its `fill` differs from the other two, and that fill is a
     token reference (`$name`), not a literal color;
  7. every color used anywhere in the document is a token reference — no literal hex at all;
  8. no text is smaller than 12px;
  9. every text keeps WCAG AA contrast against the color it is drawn on: the fill of its nearest
     painted ancestor, or of a painted shape that covers it (a label on a button is judged against
     the button).

  Positions are not scored: with auto-layout the frame places the children, so `x`/`y` may stay 0.

verification:
  command: node "${PAPRIKA_BENCH:?export PAPRIKA_BENCH=/path/to/paprika before running tb bench}/bench/tasks/pricing-columns/check.mjs" document.paprika.json
  timeout: 2m
  expected_exit_code: 0

expected_changes:
  - document.paprika.json
