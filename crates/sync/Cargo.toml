[package]
name = "paprika-sync"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Paprika team sync sidecar: Iroh transport, Loro CRDT, signed operations."
publish = false

[dependencies]
iroh = "1.5"
loro = "1.18"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
getrandom = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
