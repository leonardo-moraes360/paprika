[package]
name = "paprika-render"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Experimental Paprika canvas renderer: vello on WebGPU with a vello_cpu fallback, compiled to WASM."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vello = { version = "0.12", default-features = false, features = ["wgpu"] }
vello_cpu = { version = "0.4", default-features = false, features = ["std", "u8_pipeline"] }
vello_common = { version = "0.4", default-features = false, features = ["std"] }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "webgpu"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "CanvasRenderingContext2d", "ImageData", "Window", "Navigator", "Gpu", "console"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
