# docker compose up --build  ->  canvas http://localhost:4777 · MCP http://localhost:4777/mcp
# See docs/en-US/docker.md. The host port must stay 4777 (the server checks Host/Origin against it).
#
# Hardened: nothing in the container is writable except the /data volume and a tmpfs /tmp (Chrome's
# profile), it has no Linux capabilities and cannot gain any, and it runs as uid 65532.
services:
  paprika:
    build:
      context: .
      # Becomes the OCI labels of the image (org.opencontainers.image.version / .revision).
      args:
        VERSION: ${PAPRIKA_VERSION:-dev}
        REVISION: ${PAPRIKA_REVISION:-unknown}
    image: paprika:local
    ports:
      - "127.0.0.1:4777:4777"
    volumes:
      - paprika-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Chrome (render_screenshot) is the one big consumer; the server alone stays under 100 MB.
    mem_limit: 1g
    pids_limit: 512
    cpus: 2
    # The image's own HEALTHCHECK (GET /api/health) applies; this only tightens its timing.
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    stop_grace_period: 15s

volumes:
  paprika-data:
