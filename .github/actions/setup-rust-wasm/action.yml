name: Setup Rust for the WASM renderer
description: Installs stable Rust with the wasm32 target, caches crates/render, and installs the wasm-bindgen CLI that crates/render/build.mjs needs (checksum-pinned release, same version as Cargo.toml).
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      with:
        toolchain: stable
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: crates/render
        key: wasm-release
    - name: Install wasm-bindgen CLI
      shell: bash
      env:
        # Must match `wasm-bindgen = "=…"` in crates/render/Cargo.toml (build.mjs checks it).
        WASM_BINDGEN_VERSION: 0.2.130
        WASM_BINDGEN_SHA256: 9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f
      run: |
        name="wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl"
        url="https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/${name}.tar.gz"
        curl -sSfL --proto "=https" --proto-redir "=https" -o "$RUNNER_TEMP/wasm-bindgen.tgz" "$url"
        echo "$WASM_BINDGEN_SHA256  $RUNNER_TEMP/wasm-bindgen.tgz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/wasm-bindgen.tgz" -C "$RUNNER_TEMP" "$name/wasm-bindgen"
        mkdir -p "$RUNNER_TEMP/bin"
        mv "$RUNNER_TEMP/$name/wasm-bindgen" "$RUNNER_TEMP/bin/"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/bin/wasm-bindgen" --version
