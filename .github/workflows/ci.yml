# CI for pull requests only (never on push/merge). See docs/ci.md for the design.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push to the same PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  # Label `ci:full` on the PR runs every job on the next push, ignoring change detection.
  CI_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') && '1' || '0' }}
  FORCE_COLOR: "1"

jobs:
  plan:
    name: Plan (changed files)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.plan.outputs.full }}
      build: ${{ steps.plan.outputs.build }}
      ts: ${{ steps.plan.outputs.ts }}
      unit: ${{ steps.plan.outputs.unit }}
      unit_matrix: ${{ steps.plan.outputs.unit_matrix }}
      suites: ${{ steps.plan.outputs.suites }}
      suites_matrix: ${{ steps.plan.outputs.suites_matrix }}
      golden: ${{ steps.plan.outputs.golden }}
      go: ${{ steps.plan.outputs.go }}
      rust: ${{ steps.plan.outputs.rust }}
      codeql: ${{ steps.plan.outputs.codeql }}
      codeql_matrix: ${{ steps.plan.outputs.codeql_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch base commit
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
      - id: plan
        run: node .github/scripts/ci-plan.mjs "$BASE_SHA" HEAD

  # ---------------------------------------------------------------- TypeScript

  build:
    name: TS build + tscheck
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: server-go/go.mod
          cache-dependency-path: server-go/go.sum
      - name: Build (core, server, web)
        run: pnpm build
      - name: tscheck
        run: pnpm typecheck
      - name: Build Go server binary
        run: pnpm go:build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          retention-days: 3
          if-no-files-found: error
          path: |
            packages/core/dist
            packages/server/dist
            apps/web/dist
            server-go/bin/paprika

  unit:
    name: Unit ${{ matrix.target.pkg }} (${{ matrix.target.mode }}, shard ${{ matrix.shard }}/2)
    needs: [plan, build]
    if: needs.plan.outputs.unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.unit_matrix) }}
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
      - name: Fetch base commit (for vitest --changed)
        if: matrix.target.mode == 'changed'
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
      - name: Test
        env:
          PKG: ${{ matrix.target.pkg }}
          MODE: ${{ matrix.target.mode }}
          SHARD: ${{ matrix.shard }}
        run: |
          args=(--shard="$SHARD/2" --passWithNoTests)
          [[ "$MODE" == "changed" ]] && args+=(--changed "$BASE_SHA")
          pnpm --filter "$PKG" run test "${args[@]}"

  suites:
    name: ${{ matrix.suite }} vs ${{ matrix.impl }} server
    needs: [plan, build]
    if: needs.plan.outputs.suites == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.suites_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
      - name: Make the Go binary executable
        if: matrix.impl == 'go'
        run: chmod +x server-go/bin/paprika
      - name: Playwright version
        if: matrix.suite == 'e2e'
        id: pw
        run: echo "version=$(pnpm --filter @paprika/server exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        if: matrix.suite == 'e2e'
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium (cache miss)
        if: matrix.suite == 'e2e' && steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @paprika/server exec playwright install --with-deps chromium
      - name: Install Chromium system deps (cache hit)
        if: matrix.suite == 'e2e' && steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @paprika/server exec playwright install-deps chromium
      - name: Run ${{ matrix.suite }} against the ${{ matrix.impl }} server
        env:
          SUITE: ${{ matrix.suite }}
          IMPL: ${{ matrix.impl }}
        run: |
          [[ "$IMPL" == "go" ]] && export PAPRIKA_SERVER_BIN="$PWD/server-go/bin/paprika"
          pnpm --filter @paprika/server run "test:$SUITE"

  golden:
    name: Go fixtures up to date
    needs: [plan, build]
    if: needs.plan.outputs.golden == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
      - name: Regenerate fixtures from the TS core and MCP tools
        run: pnpm go:golden
      - name: Fail if they changed (run `pnpm go:golden` and commit)
        run: git diff --exit-code -- server-go/internal/core/testdata server-go/contract

  # ---------------------------------------------------------------- Go

  go-lint:
    name: golangci-lint
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: server-go/go.mod
          cache: false # golangci-lint-action keeps its own cache
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: server-go
      - name: go vet
        working-directory: server-go
        run: go vet ./...

  govulncheck:
    name: govulncheck
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Not golang/govulncheck-action: it installs Go "stable" by default instead of the go.mod
      # version, and the Go version decides which standard-library vulnerabilities apply.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: server-go/go.mod
          cache-dependency-path: server-go/go.sum
      - name: govulncheck
        working-directory: server-go
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  go-test:
    name: Go test (shard ${{ matrix.shard }}/2)
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: server-go/go.mod
          cache-dependency-path: server-go/go.sum
      - name: Fetch base commit
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
      - name: Select affected packages for this shard
        id: pkgs
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          pkgs=$(.github/scripts/go-affected.sh "$BASE_SHA" "$SHARD" 2 | tr '\n' ' ')
          echo "list=$pkgs" >> "$GITHUB_OUTPUT"
          echo "Packages: ${pkgs:-<none>}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: go test
        if: steps.pkgs.outputs.list != ''
        working-directory: server-go
        env:
          PKGS: ${{ steps.pkgs.outputs.list }}
        # shellcheck disable=SC2086 # word splitting of the package list is intended
        run: go test -shuffle=on $PKGS

  # ---------------------------------------------------------------- Rust

  rust:
    name: Rust ${{ matrix.task }}
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        task: [lint, test]
    defaults:
      run:
        working-directory: experiments/canvas-wasm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: experiments/canvas-wasm
          key: ${{ matrix.task }}
      - name: cargo fmt --check
        if: matrix.task == 'lint'
        run: cargo fmt --check
      - name: clippy (native)
        if: matrix.task == 'lint'
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: clippy (wasm32)
        if: matrix.task == 'lint'
        run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - name: cargo test
        if: matrix.task == 'test'
        run: cargo test --locked

  # ---------------------------------------------------------------- CodeQL

  codeql:
    name: CodeQL ${{ matrix.language }}
    needs: plan
    if: needs.plan.outputs.codeql == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.plan.outputs.codeql_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: matrix.language == 'go'
        with:
          go-version-file: server-go/go.mod
          cache-dependency-path: server-go/go.sum
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'manual' || 'none' }}
          queries: security-and-quality
          config: |
            paths-ignore:
              - "**/node_modules"
              - "**/dist"
              - "**/testdata"
      - name: Build Go (traced by CodeQL)
        if: matrix.language == 'go'
        working-directory: server-go
        run: go build -buildvcs=false ./...
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}

  # ---------------------------------------------------------------- Gate

  ci-ok:
    name: CI OK
    # The one check to require in branch protection: green when every job that ran passed and
    # the skipped ones were skipped on purpose by the plan.
    needs: [plan, build, unit, suites, golden, go-lint, govulncheck, go-test, rust, codeql]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
          PLAN: ${{ needs.plan.result }}
        run: |
          echo "$RESULTS"
          if grep -qE '"(failure|cancelled)"' <<<"$RESULTS" || [[ "$PLAN" != "success" ]]; then
            echo "::error::at least one CI job failed or was cancelled"
            exit 1
          fi
