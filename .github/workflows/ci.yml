# CI for pull requests only (never on push/merge). See docs/en-US/ci.md for the design.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push to the same PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  # Label `ci:full` on the PR runs every job on the next push, ignoring change detection.
  CI_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') && '1' || '0' }}
  FORCE_COLOR: "1"
  # Go toolchain for every job: the latest patch of this minor. go.mod's `go` line is only the
  # minimum the modules need (Dependabot writes it as e.g. `go 1.26.0`), and installing exactly
  # that would build with a standard library that govulncheck flags. Bump the minor here when
  # go.mod moves to a new one.
  GO_VERSION: "1.26"

jobs:
  plan:
    name: Plan (changed files)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.plan.outputs.full }}
      build: ${{ steps.plan.outputs.build }}
      ts: ${{ steps.plan.outputs.ts }}
      unit: ${{ steps.plan.outputs.unit }}
      unit_matrix: ${{ steps.plan.outputs.unit_matrix }}
      suites: ${{ steps.plan.outputs.suites }}
      suites_matrix: ${{ steps.plan.outputs.suites_matrix }}
      golden: ${{ steps.plan.outputs.golden }}
      go: ${{ steps.plan.outputs.go }}
      rust: ${{ steps.plan.outputs.rust }}
      sync: ${{ steps.plan.outputs.sync }}
      codeql: ${{ steps.plan.outputs.codeql }}
      codeql_matrix: ${{ steps.plan.outputs.codeql_matrix }}
      docker: ${{ steps.plan.outputs.docker }}
      site: ${{ steps.plan.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch base commit
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
      # The selector below decides whether every other job runs, so it is tested here: a wrong plan
      # is a silently untested PR. Tests only, nothing to install.
      - name: Test the CI scripts
        run: node --test .github/scripts/test/*.mjs
      # Every third-party action must be pinned to a full commit SHA with its version in a comment
      # (docs/en-US/ci.md): a tag or branch is a moving reference, and a force-push on it silently changes
      # what every later run executes.
      - name: Check pinned actions
        run: node .github/scripts/check-actions-pinned.mjs
      - id: plan
        run: node .github/scripts/ci-plan.mjs "$BASE_SHA" HEAD

  # ---------------------------------------------------------------- TypeScript

  build:
    name: TS build + tscheck
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: server/go.sum
      # The web build includes the WASM canvas renderer; without Rust it would be skipped quietly
      # and the WASM e2e tests with it.
      - uses: ./.github/actions/setup-rust-wasm
      # `pnpm build` also builds the Go server binary (pnpm go:build).
      - name: Build (core, web, WASM renderer, Go server)
        env:
          PAPRIKA_REQUIRE_WASM: "1"
        run: pnpm build
      - name: tscheck
        run: pnpm typecheck
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          retention-days: 3
          if-no-files-found: error
          path: |
            packages/core/dist
            apps/web/dist
            apps/web/src/wasm
            server/bin/paprika

  unit:
    name: Unit ${{ matrix.target.pkg }} (${{ matrix.target.mode }}, shard ${{ matrix.shard }}/2)
    needs: [plan, build]
    if: needs.plan.outputs.unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.unit_matrix) }}
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # vitest --changed diffs BASE...HEAD (merge base). With depth 1 the PR merge commit has no
          # parents in the clone, so git finds no merge base once the head branch is behind its base.
          # Depth 2 brings both parents of the merge commit, and BASE is then the merge base.
          fetch-depth: 2
      - uses: ./.github/actions/setup-node-pnpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
      - name: Fetch base commit (for vitest --changed)
        if: matrix.target.mode == 'changed'
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
      - name: Test
        env:
          PKG: ${{ matrix.target.pkg }}
          MODE: ${{ matrix.target.mode }}
          SHARD: ${{ matrix.shard }}
        run: |
          args=(--shard="$SHARD/2" --passWithNoTests)
          [[ "$MODE" == "changed" ]] && args+=(--changed "$BASE_SHA")
          pnpm --filter "$PKG" run test "${args[@]}"

  suites:
    name: ${{ matrix.suite }} vs Go server
    needs: [plan, build]
    if: needs.plan.outputs.suites == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.suites_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
      - name: Make the Go binary executable
        run: chmod +x server/bin/paprika
      # Both suites call render_screenshot, which launches Chromium (e2e also drives the canvas).
      - uses: ./.github/actions/setup-playwright
      - name: Run ${{ matrix.suite }} against the Go server
        env:
          SUITE: ${{ matrix.suite }}
          PAPRIKA_SERVER_BIN: ${{ github.workspace }}/server/bin/paprika
        run: pnpm --filter @paprika/e2e run "test:$SUITE"

  golden:
    name: Go fixtures up to date
    needs: [plan, build]
    if: needs.plan.outputs.golden == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
      - name: Regenerate fixtures from the TS core
        run: pnpm go:golden
      - name: Fail if they changed (run `pnpm go:golden` and commit)
        run: git diff --exit-code -- server/internal/core/testdata server/contract

  # ---------------------------------------------------------------- Go

  go-lint:
    name: golangci-lint
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: false # golangci-lint-action keeps its own cache
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: server
      - name: go vet
        working-directory: server
        run: go vet ./...

  govulncheck:
    name: govulncheck
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Not golang/govulncheck-action: it runs with Go "stable" instead of the go.mod version, and
      # govulncheck takes the standard-library version from the `go` on PATH.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: server/go.sum
      - name: govulncheck
        working-directory: server
        run: |
          go version
          go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  go-test:
    name: Go test (shard ${{ matrix.shard }}/2)
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: server/go.sum
      - name: Fetch base commit
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
      - name: Select affected packages for this shard
        id: pkgs
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          pkgs=$(.github/scripts/go-affected.sh "$BASE_SHA" "$SHARD" 2 | tr '\n' ' ')
          echo "list=$pkgs" >> "$GITHUB_OUTPUT"
          echo "Packages: ${pkgs:-<none>}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: go test
        if: steps.pkgs.outputs.list != ''
        working-directory: server
        env:
          PKGS: ${{ steps.pkgs.outputs.list }}
          CGO_ENABLED: "0"
        # shellcheck disable=SC2086 # word splitting of the package list is intended
        run: go test -tags nodynamic -shuffle=on $PKGS

  # ---------------------------------------------------------------- Rust

  rust:
    name: Rust ${{ matrix.task }}
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        task: [lint, test]
    defaults:
      run:
        working-directory: crates/render
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/render
          key: ${{ matrix.task }}
      - name: cargo fmt --check
        if: matrix.task == 'lint'
        run: cargo fmt --check
      - name: clippy (native)
        if: matrix.task == 'lint'
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: clippy (wasm32)
        if: matrix.task == 'lint'
        run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - name: cargo test
        if: matrix.task == 'test'
        run: cargo test --locked

  # ---------------------------------------------------------------- Team sync

  sync:
    name: Team sync (paprika-sync + internal/team)
    needs: plan
    if: needs.plan.outputs.sync == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/sync
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: server/go.sum
      - name: cargo fmt --check
        working-directory: crates/sync
        run: cargo fmt --check
      - name: clippy
        working-directory: crates/sync
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test
        working-directory: crates/sync
        run: cargo test --locked
      - name: Build the sidecar
        working-directory: crates/sync
        run: cargo build --locked
      # Two real instances (Go store + sidecar each) talking over loopback.
      - name: go test ./internal/team
        working-directory: server
        env:
          CGO_ENABLED: "0"
        run: PAPRIKA_SYNC="$GITHUB_WORKSPACE/crates/sync/target/debug/paprika-sync" go test -tags nodynamic -count=1 ./internal/team/...

  # ---------------------------------------------------------------- CodeQL

  codeql:
    name: CodeQL ${{ matrix.language }}
    needs: plan
    if: needs.plan.outputs.codeql == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.plan.outputs.codeql_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: matrix.language == 'go'
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: server/go.sum
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'manual' || 'none' }}
          queries: security-and-quality
          config: |
            paths-ignore:
              - "**/node_modules"
              - "**/dist"
              - "**/testdata"
      - name: Build Go (traced by CodeQL)
        if: matrix.language == 'go'
        working-directory: server
        env:
          CGO_ENABLED: "0"
        run: go build -tags nodynamic -buildvcs=false ./...
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}

  # ---------------------------------------------------------------- Docker

  docker:
    name: Docker image (build + smoke)
    needs: plan
    if: needs.plan.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compose files are valid
        run: |
          docker compose -f compose.yaml config -q
          docker compose -f compose.yaml -f compose.team.yaml config -q
      # hadolint 2.15.1, by digest (a `docker run` is not an action, so the pin check does not cover
      # it: bump it by hand). The ignores are inline in the Dockerfile, each with its reason.
      - name: Dockerfile lint (hadolint)
        run: docker run --rm -i hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d < Dockerfile
      # Layer cache in the GitHub Actions cache. Without it every run rebuilt every stage from
      # scratch (~330 s, the release build of paprika-sync alone ~340 s cold). With it a stage is
      # rebuilt only when its inputs change: the Dockerfile compiles the dependencies of the Rust
      # crates and of the Go server in layers of their own (inputs: Cargo.toml/Cargo.lock, go.mod/go.sum),
      # so a PR that edits only source recompiles only the crate or the packages it touched. The `gha`
      # backend needs the Actions runtime token, which only an action gets (not a `run:` step), hence
      # these two official docker/* actions. The Dockerfile still pins its own inputs (base image
      # digests, checksums, lockfiles).
      # Read-only here: .github/workflows/docker-cache.yml writes the cache from main, which every
      # PR can read. Writing from the PR too cost ~210 s per run (mode=max, ~90 layers) for entries
      # only that same PR could ever read.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (runtime target)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: paprika:ci
          cache-from: type=gha,scope=docker
          build-args: |
            REVISION=${{ github.sha }}
            CREATED=${{ github.event.pull_request.updated_at }}
          # No provenance attestation: build-push-action adds one by default, which makes the result an
          # image index, and `load: true` (docker exporter, classic image store) cannot load an index
          # ("docker exporter does not currently support exporting manifest lists"). Nothing is pushed
          # here, so there is nothing to attest.
          provenance: false
      # Hardened run (read-only root, no capabilities, no-new-privileges), non-root and no-shell checks,
      # HEALTHCHECK, paprika-sync present, render_screenshot, restart persistence, team mode, `docker stop`.
      # The slim target gets the same run minus render_screenshot (no Chrome).
      - name: Smoke test (runtime target)
        run: .github/scripts/docker-smoke.sh paprika:ci
      # Reuses every stage built above (same builder); only the final distroless layer is new.
      - name: Build (slim target)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: slim
          load: true
          tags: paprika:ci-slim
          cache-from: type=gha,scope=docker
          build-args: |
            REVISION=${{ github.sha }}
            CREATED=${{ github.event.pull_request.updated_at }}
          # No provenance attestation: build-push-action adds one by default, which makes the result an
          # image index, and `load: true` (docker exporter, classic image store) cannot load an index
          # ("docker exporter does not currently support exporting manifest lists"). Nothing is pushed
          # here, so there is nothing to attest.
          provenance: false
      - name: Smoke test (slim target)
        run: SCREENSHOT=0 .github/scripts/docker-smoke.sh paprika:ci-slim
      - name: Image sizes
        run: docker image ls paprika --format '| {{.Tag}} | {{.Size}} |' | tee -a "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- Secrets

  secrets:
    name: Secret leak scan (gitleaks)
    # Every PR, whatever it touches: a key can land in any file. Scans the whole history
    # (about 1 s today), so a secret added and removed in later commits is still caught.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks (checksum-pinned release)
        run: |
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --proto "=https" --proto-redir "=https" -o "$RUNNER_TEMP/gitleaks.tgz" "$url"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: gitleaks git (full history)
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose \
            --report-format sarif --report-path "$RUNNER_TEMP/gitleaks.sarif" .
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          retention-days: 7
          path: ${{ runner.temp }}/gitleaks.sarif

  # ---------------------------------------------------------------- Site

  site:
    name: Site build (Astro + Pagefind)
    needs: plan
    if: needs.plan.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - name: Build core
        run: pnpm --filter @paprika/core build
      - name: Build site
        run: pnpm --filter @paprika/site site:build

  # ---------------------------------------------------------------- Gate

  ci-ok:
    name: CI OK
    # The one check to require in branch protection: green when every job that ran passed and
    # the skipped ones were skipped on purpose by the plan.
    needs: [plan, build, unit, suites, golden, go-lint, govulncheck, go-test, rust, sync, codeql, docker, secrets, site]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
          PLAN: ${{ needs.plan.result }}
        run: |
          echo "$RESULTS"
          if grep -qE '"(failure|cancelled)"' <<<"$RESULTS" || [[ "$PLAN" != "success" ]]; then
            echo "::error::at least one CI job failed or was cancelled"
            exit 1
          fi
