# Warms the Docker layer cache that the PR job `docker` in ci.yml reads. Not a check: it runs no
# tests and gates nothing. It exists because GitHub keeps a cache entry for the ref that wrote it
# (and lets PRs read their base branch's), and ci.yml never runs on main: without this, every PR's
# first run built every stage from scratch and then paid ~210 s to export the cache.
# See docs/en-US/ci.md ("Caches").
name: Docker cache

on:
  push:
    branches: [main]
    # What the image packages (same areas as the `docker` output of .github/scripts/ci-plan-lib.mjs).
    paths:
      - Dockerfile
      - .dockerignore
      - packages/core/**
      - web-legacy/**
      - apps/web/**
      - crates/render/**
      - crates/sync/**
      - server/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - .github/workflows/docker-cache.yml
  workflow_dispatch:

permissions:
  contents: read

# Only the newest main matters; an older warm-up still running is wasted work.
concurrency:
  group: docker-cache
  cancel-in-progress: true

jobs:
  warm:
    name: Warm the Docker layer cache
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The runtime target builds every stage the slim target uses too. `cacheonly`: no image is
      # loaded or pushed, only the cache is written.
      - name: Build (runtime target) into the cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          outputs: type=cacheonly
          cache-from: type=gha,scope=docker
          cache-to: type=gha,scope=docker,mode=max
