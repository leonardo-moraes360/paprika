# Dependabot version updates. Security updates are enabled separately in the repository settings
# (Settings > Code security > Dependabot security updates) and ignore the schedule below.
version: 2

updates:
  # pnpm workspace (root + packages/* + apps/*): Dependabot reads pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /crates/render
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned with `=`: it must match wasm-bindgen-cli in crates/render/build.mjs, so bump both by hand.
      - dependency-name: wasm-bindgen

  # Base images of the Dockerfile (tags such as rust:1.100-slim-trixie). The checksum-pinned
  # downloads in it (wasm-bindgen, Chrome headless shell) are bumped by hand: see docs/en-US/docker.md.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"

  # Actions are pinned by commit SHA in the workflows; Dependabot keeps the SHA and the version
  # comment up to date.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
